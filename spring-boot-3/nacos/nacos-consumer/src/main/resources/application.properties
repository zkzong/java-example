server.port=8080
spring.application.name=nacos-consumer

#spring.cloud.nacos.username=nacos
#spring.cloud.nacos.password=nacos

spring.cloud.nacos.discovery.server-addr=192.168.163.128:8848

spring.cloud.nacos.config.server-addr=192.168.163.128:8848
spring.cloud.nacos.config.namespace=public
spring.config.import=optional:nacos:config.properties

# SpringDoc OpenAPI 配置
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.groups.enabled=true

# 配置 Swagger UI 调用接口时通过 Gateway
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
# 所有接口请求通过 Gateway 转发，路径前缀为 /consumer
springdoc.api-docs.servers.url=http://localhost:9000/consumer
springdoc.api-docs.servers.description=Gateway 路由
