spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.163.128:3306/mybatis?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# 使用单数据源时将配置映射为 dynamic-datasource 的 master，避免找不到 primary 数据源
spring.datasource.dynamic.primary=master
spring.datasource.dynamic.datasource.master.driver-class-name=${spring.datasource.driver-class-name}
spring.datasource.dynamic.datasource.master.url=${spring.datasource.url}
spring.datasource.dynamic.datasource.master.username=${spring.datasource.username}
spring.datasource.dynamic.datasource.master.password=${spring.datasource.password}
