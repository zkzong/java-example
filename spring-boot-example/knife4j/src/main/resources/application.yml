server:
  port: 8090

spring:
  application:
    name: knife4j-demo

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: org.example.knife4j.controller

knife4j:
  enable: true
  setting:
    language: zh-CN

